server {
    listen 80;
    server_name *.localtest.me;

    set $slug "";
    if ($host ~* "^([a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)\.localtest\.me$") {
        set $slug $1;
    }

    if ($slug = "") {
        return 404;
    }

    root /var/www/projects/$slug/current;
    index index.html;

    location / {
        try_files $uri $uri/ @spa;
    }

    # SPA fallback: serve index.html if it exists (client-side routing),
    # otherwise the project was never deployed — show the Mollire 404 page.
    location @spa {
        try_files /index.html @not_found;
    }

    location @not_found {
        root /var/www/mollire-public;
        try_files /project-not-found.html =500;
    }
}
