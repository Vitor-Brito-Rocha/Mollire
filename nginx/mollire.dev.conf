server {
    listen 80;
    # Captura qualquer subdomínio de localtest.me (ex: myapp.localtest.me).
    # localtest.me é um domínio público que resolve para 127.0.0.1 — não precisa
    # de entrada no /etc/hosts, funciona out-of-the-box em dev.
    server_name *.localtest.me;

    # Extrai o slug do subdomínio (ex: "myapp" de "myapp.localtest.me").
    # O if com regex é necessário porque Nginx não tem uma forma nativa de
    # extrair partes do $host sem rewrite/if.
    set $slug "";
    if ($host ~* "^([a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)\.localtest\.me$") {
        set $slug $1;
    }

    # Rejeita requests que não casaram com o padrão acima (slug vazio).
    # Na prática isso só ocorre se alguém acessar localtest.me diretamente,
    # sem subdomínio.
    if ($slug = "") {
        return 404;
    }

    # Cada projeto é servido a partir do seu próprio diretório de deploy.
    # A pasta "current" aponta para a versão mais recente (symlink atualizado
    # pelo pipeline de deploy).
    root /var/www/projects/$slug/current;
    index index.html;

    # -------------------------------------------------------------------------
    # Subrequisição de autenticação
    # -------------------------------------------------------------------------
    # Chamada internamente pelo auth_request em location /. Nunca acessível
    # diretamente pelo browser (internal).
    #
    # A API responde com:
    #   200            → acesso permitido
    #   401            → não autenticado (sem sessão)
    #   403            → autenticado mas sem permissão, ou projeto inexistente
    #                    (o header X-Auth-Result distingue os dois casos)
    #
    # host.docker.internal: necessário porque o Nginx roda em container Docker
    # e 127.0.0.1 aponta para o loopback do próprio container, não para o host
    # onde a API escuta na porta 4000.
    #
    # resolver 127.0.0.11: DNS interno do Docker, necessário para resolver
    # "host.docker.internal" em tempo de execução (não na inicialização).
    location = /_internal_auth {
        internal;
        resolver 127.0.0.11 valid=30s;
        proxy_pass http://host.docker.internal:4000/internal/auth?slug=$slug;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Accept $http_accept;
    }

    # -------------------------------------------------------------------------
    # Rota principal — serve os arquivos estáticos do projeto
    # -------------------------------------------------------------------------
    # Todo request passa pelo auth_request antes de ser servido.
    # O header X-Auth-Result retornado pela API é capturado em $auth_result
    # para uso nos handlers de erro abaixo.
    location / {
        auth_request /_internal_auth;
        auth_request_set $auth_result $upstream_http_x_auth_result;
        auth_request_set $visitor_id $upstream_http_x_visitor_id;
        add_header Set-Cookie $mollire_set_cookie;
        error_page 401 = @login;
        error_page 403 = @forbidden;
        try_files $uri $uri/ @spa;
    }

    # Fallback de SPA: se o arquivo/diretório não existir no disco, serve
    # index.html para que o roteamento client-side funcione. Só é alcançado
    # após o auth_request já ter passado.
    location @spa {
        add_header Set-Cookie $mollire_set_cookie;
        try_files /index.html @not_found;
    }

    # -------------------------------------------------------------------------
    # Handlers de erro
    # -------------------------------------------------------------------------

    # Sessão ausente: redireciona para o login, preservando a URL original
    # no parâmetro ?next para redirecionar de volta após autenticar.
    location @login {
        return 302 http://localhost:3000/login?next=$scheme://$host$request_uri;
    }

    # Acesso negado pela API (403). Diferencia dois casos via X-Auth-Result:
    #   - "not_found": o slug não existe na base → redireciona internamente
    #     para /_mollire_not_found que serve project-not-found.html
    #   - qualquer outro valor: usuário existe mas não tem acesso → forbidden.html
    #
    # O rewrite com "last" é o único uso seguro de if+rewrite em named locations:
    # ele para o bloco atual e reinicia o matching de locations no Nginx.
    location @forbidden {
        if ($auth_result = "not_found") {
            rewrite ^ /_mollire_not_found last;
        }
        root /var/www/mollire-public;
        try_files /forbidden.html =403;
    }

    # Location interna auxiliar usada pelo rewrite acima. O "internal" impede
    # acesso direto pelo browser a /_mollire_not_found.
    location = /_mollire_not_found {
        internal;
        root /var/www/mollire-public;
        try_files /project-not-found.html =404;
    }

    # index.html não encontrado no disco (projeto deployado sem SPA ou deploy
    # ausente). Usa a mesma página de projeto-não-encontrado por falta de
    # alternativa mais específica.
    location @not_found {
        root /var/www/mollire-public;
        try_files /project-not-found.html =404;
    }
}
