server {
    listen 80;
    server_name *.localtest.me;

    set $slug "";
    if ($host ~* "^([a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)\.localtest\.me$") {
        set $slug $1;
    }

    if ($slug = "") {
        return 404;
    }

    root /var/www/projects/$slug/current;
    index index.html;

    # Sub-requisição interna de auth_request — inacessível diretamente pelo browser.
    # host.docker.internal: necessário em dev porque o Nginx roda em container Docker
    # e 127.0.0.1 seria o loopback do container, não o host onde a API escuta.
    location = /_internal_auth {
        internal;
        resolver 127.0.0.11 valid=30s;
        proxy_pass http://host.docker.internal:4000/internal/auth?slug=$slug;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    location / {
        auth_request /_internal_auth;
        error_page 401 = @login;
        error_page 403 = @forbidden;
        try_files $uri $uri/ @spa;
    }

    # @spa é alcançado apenas após o auth_request em location / já ter passado.
    location @spa {
        try_files /index.html @not_found;
    }

    location @login {
        return 302 http://localhost:3000/login?next=$scheme://$host$request_uri;
    }

    location @forbidden {
        root /var/www/mollire-public;
        try_files /forbidden.html =403;
    }

    location @not_found {
        root /var/www/mollire-public;
        try_files /project-not-found.html =500;
    }
}
