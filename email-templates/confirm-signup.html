<!--
  Mollire — "Confirm signup" email template.
  Paste into the Supabase Dashboard: Authentication → Emails → Confirm signup.
  Requires the /auth/confirm page (apps/web/src/app/auth/confirm/page.tsx) —
  it sends {{ .TokenHash }} to the API (POST /auth/confirm), which sets the
  session cookie, before redirecting into the app.

  Replace LOGO_URL below with the deployed app's icon URL once apps/web is on
  Vercel (e.g. https://mollire.aulvi.com.br/brand/icon-light.png). Until then,
  leave it out — most mail clients block images from an unset/placeholder host
  anyway, and the wordmark text below carries the brand without it.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f6eef0;padding:32px 0;font-family:Georgia,'Times New Roman',serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:12px;overflow:hidden;">
        <tr>
          <td style="padding:40px 40px 24px 40px;text-align:center;">
            <!-- <img src="LOGO_URL" width="48" height="48" alt="Mollire" style="display:block;margin:0 auto 12px auto;" /> -->
            <div style="font-size:24px;letter-spacing:0.08em;color:#c2455f;font-weight:bold;">MOLLIRE</div>
          </td>
        </tr>
        <tr>
          <td style="padding:0 40px;">
            <h1 style="font-size:20px;color:#2b2b2e;margin:0 0 16px 0;">Confirme seu cadastro</h1>
            <p style="font-size:16px;line-height:1.6;color:#4a4a4f;margin:0 0 24px 0;">
              Obrigado por criar sua conta na Mollire. Confirme seu email para
              começar a publicar seus projetos.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 40px;text-align:center;">
            <a
              href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=signup&next=/"
              style="display:inline-block;background-color:#e8869a;color:#ffffff;text-decoration:none;font-family:Georgia,'Times New Roman',serif;font-size:16px;padding:12px 32px;border-radius:8px;"
            >
              Confirmar email
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:32px 40px 40px 40px;">
            <p style="font-size:13px;line-height:1.6;color:#8a8a8f;margin:0;">
              Se você não criou essa conta, pode ignorar este email com
              segurança.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
