<!doctype html>
<html lang="pt-BR" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <!-- O tema salvo entra antes da primeira pintura, para a tela não piscar. Padrão: escuro. -->
    <script>
      try {
        document.documentElement.classList.toggle("dark", localStorage.getItem("mollire:theme") !== "light");
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mollire</title>
    <meta name="description" content="Publique, receba estrelas, suba de nível." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <!-- O apple-icon ainda é a chama antiga — trocar quando houver o PNG da marca. -->
    <link rel="apple-touch-icon" href="/apple-icon.png" />
  </head>
  <body class="min-h-full flex flex-col">
    <div id="root" class="flex min-h-screen flex-1 flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
