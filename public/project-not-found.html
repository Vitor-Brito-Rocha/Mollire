<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto não encontrado — Mollire</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0c0f16;
      --card:     #131824;
      --border:   #2a3346;
      --line2:    #38425a;
      --primary:  #5ee2ff;
      --fg:       #eef1f7;
      --muted:    #a3adc2;
      --text3:    #7f8aa3;
      --glow:     rgba(94, 226, 255, 0.35);
      --halo:     rgba(94, 226, 255, 0.08);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      background-image: radial-gradient(ellipse 70% 40% at 50% -5%, var(--halo), transparent 60%);
      background-repeat: no-repeat;
      color: var(--fg);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* scan-line overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.06) 2px,
        rgba(0,0,0,0.06) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── logo ── */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--fg);
    }
    .brand svg { filter: drop-shadow(0 0 8px var(--glow)); }
    .brand-name {
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--fg);
    }

    /* ── card ── */
    .card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 48px 56px;
      width: min(480px, 92vw);
      text-align: center;
      --corner: var(--primary);
    }

    /* corner brackets */
    .card::before,
    .card::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      pointer-events: none;
      animation: pulse 3s ease-in-out infinite;
    }
    .card::before {
      top: -1px; left: -1px;
      border-top: 2px solid var(--corner);
      border-left: 2px solid var(--corner);
    }
    .card::after {
      bottom: -1px; right: -1px;
      border-bottom: 2px solid var(--corner);
      border-right: 2px solid var(--corner);
    }
    .card .corner-tr,
    .card .corner-bl {
      position: absolute;
      width: 14px;
      height: 14px;
      pointer-events: none;
      animation: pulse 3s ease-in-out infinite;
    }
    .card .corner-tr {
      top: -1px; right: -1px;
      border-top: 2px solid var(--corner);
      border-right: 2px solid var(--corner);
    }
    .card .corner-bl {
      bottom: -1px; left: -1px;
      border-bottom: 2px solid var(--corner);
      border-left: 2px solid var(--corner);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ── error code ── */
    .error-code {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .error-code::before,
    .error-code::after {
      content: '';
      display: block;
      width: 24px;
      height: 1px;
      background: var(--primary);
      opacity: 0.5;
    }

    .error-number {
      font-size: 72px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--fg);
      line-height: 1;
      margin-bottom: 4px;
      text-shadow: 0 0 40px var(--glow);
      position: relative;
      display: inline-block;
    }
    .error-number::after {
      content: '_';
      animation: blink 1.1s step-end infinite;
      color: var(--primary);
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ── divider ── */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 24px 0;
    }

    /* ── message ── */
    .label {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 10px;
    }
    .title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--fg);
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .body {
      font-size: 13px;
      line-height: 1.7;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    /* ── cta ── */
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 32px;
      padding: 11px 24px;
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      transition: background 0.15s, box-shadow 0.15s;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    }
    .cta:hover {
      background: rgba(94, 226, 255, 0.08);
      box-shadow: 0 0 16px var(--glow);
    }
    .cta svg {
      transition: transform 0.15s;
    }
    .cta:hover svg {
      transform: translateX(3px);
    }

    /* ── footer ── */
    .footer {
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--text3);
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="stage">

    <a class="brand" href="https://app.aulvi.com.br">
      <svg viewBox="0 0 24 24" width="28" height="28" role="img" aria-label="Mollire">
        <path fill="#5ee2ff" d="M7 0h17v17l-7 7H0V7z"/>
        <path fill="#0c0f16" d="M12 5.5l7.5 7.5-2.6 2.6L12 10.7l-4.9 4.9L4.5 13z"/>
      </svg>
      <span class="brand-name">Mollire</span>
    </a>

    <div class="card">
      <span class="corner-tr"></span>
      <span class="corner-bl"></span>

      <div class="error-code">erro</div>
      <div class="error-number">404</div>

      <div class="divider"></div>

      <p class="label">status do projeto</p>
      <p class="title">Projeto não encontrado</p>
      <p class="body">
        Este endereço não corresponde a nenhum projeto publicado.<br>
        O projeto pode não existir ou ainda não ter sido deployado.
      </p>

      <a class="cta" href="https://app.aulvi.com.br">
        Ir para o painel
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </a>
    </div>

    <p class="footer">aulvi.com.br &nbsp;·&nbsp; deploy platform</p>

  </div>
</body>
</html>
